<!DOCTYPE html>
<html lang="en">
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor decoder</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>Resistor decoder</h1>
    
    <nav class="tabs">
        <button class="tab active" data-tab="color">Color Code</button>
        <button class="tab" data-tab="smd">SMD Code</button>
        <button class="tab" data-tab="reverse">Value to Colors</button>
    </nav>

    <section id="color" class="panel active">
        <h2>Color Code</h2>
       <label for="band-count">Bands:</label>
    <select id="band-count">
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
    </select>
    <svg id="resistor" viewBox="0 0 300 80" width="300" height="80"></svg>
    <div id="bands"></div>
    <p id="result">Resistance: -</p>
    <p id="range"></p>
    <p id="series"></p>
    </section>
    <section id="smd" class="panel">
        <h2>SMD Code</h2>
        <label for="smd-input">Code:</label>
        <input type="text" id="smd-input" placeholder="472" maxlength="4">

        <p id="smd-result">Resistance: -</p>
        </section>
        <section id="reverse" class="panel">
            <h2>Value to Colors</h2>
            <label for="reverse-input">Value</label>
            <input type="text" id="reverse-input" placeholder="4,7k">

            <p id="reverse-result"></p>
            <div id="reverse-output"></div>
        </section>
    <script src="script.js"></script>
    
   
</body>
</html>
